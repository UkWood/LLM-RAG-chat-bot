name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked offline-parser dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Offline tests and measured lexical baseline
        run: python scripts/verify_offline.py

  onnx-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked optional ONNX runtime
        run: python -m pip install --require-hashes -r backend/requirements-onnx.lock
      - name: Real CPU runtime contracts (authored numeric graphs, no language model)
        run: PYTHONPATH=backend/src python -m unittest discover -s backend/tests -p test_embeddings.py -v

      - name: Prepared bundle contracts (numeric graphs, no semantic quality claim)
        run: PYTHONPATH=backend/src python -m unittest discover -s backend/tests -p test_model_preparation.py -v

      - name: Actual CPU pair-scoring contracts (numeric graphs, no pretrained download)
        run: PYTHONPATH=backend/src python -m unittest discover -s backend/tests -p 'test_rerank*.py' -v

      - name: Untruncated intent-pair token budget (authored numeric graph, no semantic quality claim)
        run: PYTHONPATH=backend/src python -m unittest discover -s backend/tests -p test_v3_router.py -v
