name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked offline-parser dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Offline tests and measured lexical baseline
        run: python scripts/verify_offline.py

  onnx-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked optional ONNX runtime
        run: python -m pip install --require-hashes -r backend/requirements-onnx.lock
      - name: Real CPU runtime contracts (authored numeric graphs, no language model)
        run: PYTHONPATH=backend/src python -m unittest discover -s backend/tests -p test_embeddings.py -v

      - name: Prepared bundle contracts (numeric graphs, no semantic quality claim)
        run: PYTHONPATH=backend/src python -m unittest discover -s backend/tests -p test_model_preparation.py -v

      - name: Actual CPU pair-scoring contracts (numeric graphs, no pretrained download)
        run: PYTHONPATH=backend/src python -m unittest discover -s backend/tests -p 'test_rerank*.py' -v

  saturn-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked parser dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Assert original frozen calibration artifacts unchanged
        run: |
          test "$(git rev-parse HEAD:evaluation/datasets/saturn-grounding-calibration-v0.1.json)" = "a4ca1c2567e391319e26b0ca905c38f8739400cb"
          test "$(git rev-parse HEAD:evaluation/reports/saturn-grounding-calibration-v0.1.json)" = "ffd6259552c56cd86c230490f60339e437303f7f"
      - name: Verify committed open calibration dataset against canonical fixture
        run: |
          PYTHONPATH=backend/src python -m saturn_ai.evaluation.saturn_grounding --profile calibration --generate-calibration --dataset /tmp/saturn-gold.json
          cmp /tmp/saturn-gold.json evaluation/datasets/saturn-grounding-calibration-v0.1.json
      - name: Measure Stage 5E end-to-end using frozen calibration gold
        run: PYTHONPATH=backend/src python -m saturn_ai.evaluation.saturn_grounding --profile calibration --dataset evaluation/datasets/saturn-grounding-calibration-v0.1.json --report /tmp/saturn-report.json --emit-open-json
      - name: Controlled Stage 5E policy, technical error and simulated conflict measurement
        run: PYTHONPATH=backend/src python -m saturn_ai.evaluation.saturn_controlled

  saturn-evaluator-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked parser dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Stage 5E evaluator and Acceptance Review correction regressions
        run: PYTHONPATH=backend/src python -m unittest discover -s backend/tests/unit -p 'test_saturn_grounding_evaluation*.py' -v
